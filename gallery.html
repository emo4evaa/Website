<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
              background-color: rgb(213, 123, 229);
            }
            </style>
    </head>
  <body>
    
    <!-- Slide Show -->
    <section>
        <center>
            <h1>Different Cuisines across the world </h1>
      <img class="mySlides" src="food 1.jpeg" style="height:500px; width: 800px;">
      <img class="mySlides" src="food 2.jpeg" style="height:500px;width: 800px;">
      <img class="mySlides" src="food 3.jpg" style="height:500px;width: 800px;">
      <img class="mySlides" src="food 4.webp" style="height:500px;width: 800px;">
      <img class="mySlides" src="food 5.jpg" style="height:500px;width: 800px;">
     </center>
    </section>
    <script>
      
      var myIndex = 0;
      carousel();

      function carousel() {
        var i;
        var x = document.getElementsByClassName("mySlides");
        for (i = 0; i < x.length; i++) {
          x[i].style.display = "none";
        }
        myIndex++;
        if (myIndex > x.length) {myIndex = 1}
        x[myIndex-1].style.display = "block";
        setTimeout(carousel, 3000);
      }
    </script>
  </body>
</html>
